name: Apply Android time-input compatibility fix

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - 'hotfixes/2026-09-13-android-time-input.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Replace native mobile time picker
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          index = Path('Index.html')
          src = index.read_text(encoding='utf-8')
          replacements = {
              '<label id="absenceStartTimeWrap" class="hidden">Masa mula<input id="absenceStartTime" name="startTime" type="time"></label>': '<label id="absenceStartTimeWrap" class="hidden">Masa mula<input id="absenceStartTime" name="startTime" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="08:30" pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" title="Taip 4 digit masa, contoh 0830" oninput="formatClockInput(this)" onblur="normalizeClockInput(this)"></label>',
              '<label id="absenceEndTimeWrap" class="hidden">Masa akhir<input id="absenceEndTime" name="endTime" type="time"></label>': '<label id="absenceEndTimeWrap" class="hidden">Masa akhir<input id="absenceEndTime" name="endTime" type="text" inputmode="numeric" autocomplete="off" maxlength="5" placeholder="16:30" pattern="(?:[01][0-9]|2[0-3]):[0-5][0-9]" title="Taip 4 digit masa, contoh 1630" oninput="formatClockInput(this)" onblur="normalizeClockInput(this)"></label>'
          }
          for old, new in replacements.items():
              count = src.count(old)
              if count != 1:
                  raise SystemExit(f'Index time field expected 1 match, got {count}')
              src = src.replace(old, new, 1)
          index.write_text(src, encoding='utf-8')

          scripts = Path('Scripts.html')
          js = scripts.read_text(encoding='utf-8')
          marker = '  function updateAbsenceModeUi(){\n'
          if js.count(marker) != 1:
              raise SystemExit(f'updateAbsenceModeUi marker count={js.count(marker)}')
          helper_lines = [
              '  // Cross-platform HH:MM entry for Android/WebView compatibility.',
              '  function formatClockInput(el){',
              '    if(!el)return;',
              "    const digits=String(el.value||'').replace(/\\D/g,'').slice(0,4);",
              '    if(digits.length<=2){el.value=digits;return;}',
              '    if(digits.length===3&&Number(digits.slice(0,2))>23){',
              '      el.value=`0${digits.charAt(0)}:${digits.slice(1)}`;',
              '      return;',
              '    }',
              '    el.value=`${digits.slice(0,2)}:${digits.slice(2)}`;',
              '  }',
              '',
              '  function normalizeClockInput(el){',
              '    if(!el)return;',
              "    const digits=String(el.value||'').replace(/\\D/g,'').slice(0,4);",
              "    if(!digits){el.value='';return;}",
              '    let d=digits;',
              "    if(d.length===3&&Number(d.slice(0,2))>23)d='0'+d;",
              '    if(d.length!==4)return;',
              '    const hour=Number(d.slice(0,2)),minute=Number(d.slice(2));',
              "    if(hour>=0&&hour<=23&&minute>=0&&minute<=59)el.value=`${String(hour).padStart(2,'0')}:${String(minute).padStart(2,'0')}`;",
              '  }',
              ''
          ]
          helper = '\n'.join(helper_lines) + '\n'
          js = js.replace(marker, helper + marker, 1)
          scripts.write_text(js, encoding='utf-8')
          PY

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/ek-scripts.js
          node --check /tmp/ek-scripts.js
          grep -q 'inputmode="numeric"' Index.html
          grep -q 'function formatClockInput' Scripts.html

      - name: Commit compatibility fix
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Index.html Scripts.html; then
            echo 'No source changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Index.html Scripts.html
          git commit -m 'fix: replace Android native time picker for Keberadaan'
          git push origin HEAD:refactor/performance-v2
