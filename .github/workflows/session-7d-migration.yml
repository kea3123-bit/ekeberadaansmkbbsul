name: Apply 7-day trusted session policy

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/session-7d-migration.yml'

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0

      - name: Change remembered session policy from 30 to 7 days
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_exact(path, old, new, expected=1):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != expected:
                  raise SystemExit(f'{path}: expected {expected} occurrence(s), found {count}: {old!r}')
              p.write_text(text.replace(old, new), encoding='utf-8')

          # Canonical backend policy.
          replace_exact('apps-script/00_Core.gs', 'REMEMBER_DAYS: 30,', 'REMEMBER_DAYS: 7,')
          replace_exact('apps-script/00_Core.gs', 'sesi peranti 30 hari.', 'sesi peranti 7 hari.')

          # Browser cookie lifetime + user/admin copy.
          replace_exact('Scripts.html', '30-day trusted device', '7-day trusted device')
          replace_exact('Scripts.html', 'peranti ini akan kekal log masuk sehingga 30 hari.', 'peranti ini akan kekal log masuk sehingga 7 hari.')
          replace_exact('Scripts.html', 'Peranti ini diingati selama 30 hari.', 'Peranti ini diingati selama 7 hari.')
          replace_exact('Scripts.html', "writeCookie('ek_session',token,30*24*60*60,false);", "writeCookie('ek_session',token,7*24*60*60,false);")
          replace_exact('Scripts.html', "writeCookie('ek_session_p',token,30*24*60*60,true);", "writeCookie('ek_session_p',token,7*24*60*60,true);")
          replace_exact('Scripts.html', "writeCookie('ek_device',deviceToken,30*24*60*60,false);", "writeCookie('ek_device',deviceToken,7*24*60*60,false);")
          replace_exact('Scripts.html', "writeCookie('ek_device_p',deviceToken,30*24*60*60,true);", "writeCookie('ek_device_p',deviceToken,7*24*60*60,true);")
          replace_exact('Scripts.html', 'rolling 30 hari', 'rolling 7 hari')
          replace_exact('Scripts.html', 'tempoh trusted device kepada 30 hari.', 'tempoh trusted device kepada 7 hari.')

          # Trusted-device backend: enforce 7-day rolling policy even for rows
          # originally issued under the old 30-day policy.
          replace_exact('apps-script/11_Sessions.gs', 'Trusted-device session (30-day rolling, max 2 devices)', 'Trusted-device session (7-day rolling, max 2 devices)')

          anchor = """function dateMillis_(v) {
            if (v instanceof Date && !isNaN(v.getTime())) return v.getTime();
            const d = v ? new Date(v) : null;
            return d && !isNaN(d.getTime()) ? d.getTime() : 0;
          }
          """
          helper = anchor + """
          // Effective expiry is capped by the current rolling policy, even for
          // trusted-device rows created when REMEMBER_DAYS used to be longer.
          function trustedDevicePolicyExpiryMs_(rec) {
            rec = rec || {};
            const anchorMs = dateMillis_(rec.lastSeenAt || rec.createdAt);
            const policyMs = anchorMs ? anchorMs + Math.max(1, Number(EK.SESSION.REMEMBER_DAYS || 7)) * 24 * 60 * 60 * 1000 : 0;
            const storedMs = dateMillis_(rec.expiresAt);
            if (policyMs && storedMs) return Math.min(policyMs, storedMs);
            return policyMs || storedMs;
          }

          function trustedDevicePolicyExpired_(rec, nowMs) {
            const expiryMs = trustedDevicePolicyExpiryMs_(rec);
            return !!(expiryMs && Number(nowMs || Date.now()) > expiryMs);
          }
          """
          replace_exact('apps-script/11_Sessions.gs', anchor, helper)
          replace_exact('apps-script/11_Sessions.gs', "if (dateMillis_(rec.expiresAt) && Date.now() > dateMillis_(rec.expiresAt)) {", "if (trustedDevicePolicyExpired_(rec)) {", expected=2)
          replace_exact('apps-script/11_Sessions.gs', "if ((dateMillis_(d.expiresAt) && Date.now() > dateMillis_(d.expiresAt))) {", "if (trustedDevicePolicyExpired_(d)) {")
          replace_exact('apps-script/11_Sessions.gs', "'TAMAT_30_HARI'", "'TAMAT_7_HARI'", expected=3)
          replace_exact('apps-script/11_Sessions.gs', "function publicTrustedDevice_(d) {\n  return {", "function publicTrustedDevice_(d) {\n  const effectiveExpiryMs = trustedDevicePolicyExpiryMs_(d);\n  return {")
          replace_exact('apps-script/11_Sessions.gs', "expiresAt:d.expiresAt ? formatDateTime_(d.expiresAt) : '',", "expiresAt:effectiveExpiryMs ? formatDateTime_(new Date(effectiveExpiryMs)) : '',")
          PY

          # Runtime/session-specific old values must be gone.
          ! grep -nE '30-day trusted device|rolling 30 hari|TAMAT_30_HARI|30\*24\*60\*60|REMEMBER_DAYS: 30' Scripts.html apps-script/00_Core.gs apps-script/11_Sessions.gs

          # Basic syntax validation for backend and built frontend.
          npm install --ignore-scripts --no-audit --no-fund
          python3 scripts/build-pages.py
          for f in _site/assets/*.js; do node --check "$f"; done
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js

      - name: Commit 7-day policy
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "kea3123-bit"
          git config user.email "kea3123@moe.edu.my"
          git add Scripts.html apps-script/00_Core.gs apps-script/11_Sessions.gs
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "feat: shorten remembered sessions to 7 days"
          git push origin HEAD:refactor/performance-v2
