name: Apply launch performance phase 2

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-launch-performance-phase2.yml'
      - '.github/scripts/launch-performance-phase2.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply phase 2 performance patch
        run: python3 .github/scripts/launch-performance-phase2.py
      - name: Validate backend syntax and hot-path contracts
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script.js
          node --check /tmp/apps-script.js
          python3 - <<'PY'
          from pathlib import Path
          att=Path('apps-script/41_AttendanceData.gs').read_text()
          auth=Path('apps-script/10_Auth.gs').read_text()
          user=Path('apps-script/20_UserApi.gs').read_text()
          diag=Path('apps-script/95_Diagnostics.gs').read_text()
          assert "EK_PERF_ATT_INDEX_V3" in att
          assert "byKey" in att and "function registerAttendanceRow_" in att
          assert "readAttendanceRowsByRowNumbers_(sh, rowNumbers)" in att
          assert "EK_PERF_PUNCH_IP_HOUR_V1_" in auth
          assert "function registerPunchIpUse_" in auth
          assert "lock.waitLock(20000)" in user
          assert "registerAttendanceRow_(dateKey,user.email,row)" in user
          assert "registerPunchIpUse_(ipCheck,user,type,session,recordIp,now)" in user
          assert "performance:{lockWaitMs,lockHeldMs,totalMs" in user
          # Old hot path must be gone.
          assert "const todayRows = getAttendanceByDate_(dateKey);" not in user
          assert "invalidateAttendanceIndex_();\n      rec =" not in user
          # Audit and review work must be after lock.releaseLock().
          release=user.index('lock.releaseLock();')
          assert user.index("audit_(action", release) > release
          assert user.index('createTimeReviewRecord_({', release) > release
          assert "launchReadiness" in diag
          PY
      - name: Commit phase 2 app changes
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/launch-performance-phase2.py
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'perf: optimize punch hot path for launch bursts'
          git push origin HEAD:refactor/performance-v2
