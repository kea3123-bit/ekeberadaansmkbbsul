name: Apply punch card print pages

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/scripts/patch-punchcard-print-pages.py'
      - '.github/workflows/apply-punchcard-print-pages.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply two-page print patch
        run: python3 .github/scripts/patch-punchcard-print-pages.py
      - name: Validate frontend and print contract
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/frontend.js
          node --check /tmp/frontend.js
          grep -q "buildPunchCardPrintPages" Scripts.html
          grep -q "\[1,2\].forEach" Scripts.html
          grep -q "@page{size:A4 portrait;margin:0}" Styles.html
          grep -q "punch-card-print-page:last-child" Styles.html
          grep -q "width:194mm!important" Styles.html
          grep -q "height:283mm!important" Styles.html
      - name: Commit app change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-punchcard-print-pages.py .github/workflows/apply-punchcard-print-pages.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m "fix: print punch card as two full A4 pages"
          git push origin HEAD:refactor/performance-v2
