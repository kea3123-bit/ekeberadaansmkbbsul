name: Apply punch-card presence type

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-punch-card-presence-type.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0

      - name: Patch shared punch-card renderer
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('web/config.js')
          text = path.read_text(encoding='utf-8')
          old = """      const hasPresence = String(r.reason || '').toUpperCase().includes('KEBERADAAN') || String(r.source || '').toUpperCase() === 'KEBERADAAN';
      const presenceStatement = hasPresence ? 'KEBERADAAN — Maklum from Pengetua' : '';
"""
          new = """      const rawPresenceReason = String(r.reason || '').trim();
      const reasonMatch = rawPresenceReason.match(/(?:^|[·|])\\s*KEBERADAAN:\\s*([^·|]+)/i);
      const presenceType = String(r.presenceType || (reasonMatch ? reasonMatch[1] : '') || '').trim();
      const hasPresence = !!presenceType || rawPresenceReason.toUpperCase().includes('KEBERADAAN') || String(r.source || '').toUpperCase() === 'KEBERADAAN';
      const presenceStatement = hasPresence
        ? `${presenceType || 'Keberadaan'} — Maklum from Pengetua`
        : '';
"""
          if old not in text:
              raise SystemExit('Expected punch-card presence block not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-punch-card-presence-type.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web/config.js .github/workflows/apply-punch-card-presence-type.yml
          git commit -m "fix: show selected presence type on both punch cards"
          git push origin HEAD:refactor/performance-v2
