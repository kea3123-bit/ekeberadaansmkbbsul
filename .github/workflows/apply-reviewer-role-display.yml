name: Apply reviewer role-only display

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-reviewer-role-display.yml'
      - '.github/scripts/patch-reviewer-role-display.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply role-only reviewer presentation
        run: python3 .github/scripts/patch-reviewer-role-display.py
      - name: Validate frontend syntax and privacy anchors
        shell: bash
        run: |
          set -euo pipefail
          node --check web/config.js
          grep -q 'review-by-role' web/config.js
          grep -q 'Diambil maklum' web/config.js
          grep -q 'Tarikh/Masa:' web/config.js
          grep -q 'Catatan:' web/config.js
          ! grep -q 'const reviewerEmail =' web/config.js
          ! grep -q 'reviewerName || r.reviewedBy' web/config.js
      - name: Commit app change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-reviewer-role-display.py .github/workflows/apply-reviewer-role-display.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: show reviewer role only in review decisions'
          git push origin HEAD:refactor/performance-v2
