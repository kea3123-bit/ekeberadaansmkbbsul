name: Apply yesterday tomorrow date presets

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/scripts/patch-date-presets.py'
      - '.github/workflows/apply-date-presets.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply date preset patch
        run: python3 .github/scripts/patch-date-presets.py
      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/frontend.js
          node --check /tmp/frontend.js
          test "$(grep -o ">Semalam</button>" Index.html | wc -l)" -eq 3
          test "$(grep -o ">Esok</button>" Index.html | wc -l)" -eq 3
          grep -q "kind==='yesterday'" Scripts.html
          grep -q "kind==='tomorrow'" Scripts.html
          grep -q "setAbsencePublicPreset('yesterday')" Index.html
          grep -q "setAbsencePublicPreset('tomorrow')" Index.html
          grep -q "setAbsenceManagePreset('yesterday')" Index.html
          grep -q "setAbsenceManagePreset('tomorrow')" Index.html
          grep -q "setTimeReviewPreset('yesterday')" Index.html
          grep -q "setTimeReviewPreset('tomorrow')" Index.html
          echo DATE_PRESETS_OK
      - name: Commit app change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-date-presets.py .github/workflows/apply-date-presets.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: add yesterday and tomorrow date presets'
          git push origin HEAD:refactor/performance-v2
