name: Apply punchcard history sync

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - 'hotfixes/2026-09-13-punchcard-history-sync.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Punch Card history fix
        run: python3 hotfixes/2026-09-13-punchcard-history-sync.py

      - name: Validate patched source
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js
          cp Scripts.html /tmp/Scripts.js
          node --check /tmp/Scripts.js
          grep -q 'ensureKnownLegacyScheduleMigrations_' apps-script/20_UserApi.gs
          grep -q 'cleanupInvalidTimeReviewsForUser_' apps-script/60_TimeReview.gs
          grep -q 'MIGRASI_LEGASI_0830' apps-script/43_ScheduleHistory.gs
          grep -q 'activeFlags.includes(type)' Scripts.html

      - name: Commit source changes and remove temporary patch assets
        shell: bash
        run: |
          set -euo pipefail
          rm -f hotfixes/2026-09-13-punchcard-history-sync.py
          rm -f hotfixes/2026-09-13-punchcard-history-sync.trigger
          rm -f .github/workflows/apply-punchcard-history-sync.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: align punchcard with effective schedule history'
          git push
