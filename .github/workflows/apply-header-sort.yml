name: Apply table header sorting

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/scripts/patch-header-sort.py'
      - '.github/workflows/apply-header-sort.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply header sorting patch
        run: python3 .github/scripts/patch-header-sort.py
      - name: Validate frontend
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/frontend.js
          node --check /tmp/frontend.js
          node --check web/config.js
          ! grep -q 'id="reportSort"' Index.html
          ! grep -q 'id="userSort"' Index.html
          ! grep -q 'id="absenceManageSort"' Index.html
          grep -q "toggleTableSort('report','name')" Index.html
          grep -q "toggleTableSort('users','category')" Index.html
          grep -q 'Table-header sorting' Styles.html
      - name: Commit app change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-header-sort.py .github/workflows/apply-header-sort.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: move sorting controls into table headers'
          git push origin HEAD:refactor/performance-v2
