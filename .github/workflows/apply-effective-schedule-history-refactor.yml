name: Apply effective schedule history to performance refactor

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/patches/2026-09-13-effective-schedule-history.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply modular Apps Script patch
        run: python3 .github/patches/2026-09-13-effective-schedule-history.py

      - name: Validate backend syntax and contracts
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js
          grep -q 'function ensureScheduleHistoryBaseline_' apps-script/43_ScheduleHistory.gs
          grep -q 'function recordScheduleTransition_' apps-script/43_ScheduleHistory.gs
          grep -q 'getScheduleTimingContext_' apps-script/60_TimeReview.gs
          grep -q 'SEJARAH_JADUAL' apps-script/43_ScheduleHistory.gs
          grep -q 'ensureScheduleHistoryBaseline_' apps-script/20_UserApi.gs
          grep -q 'recordScheduleSettingsTransitions_' apps-script/21_AdminApi.gs

      - name: Commit source changes and remove temporary patch assets
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/20_UserApi.gs apps-script/21_AdminApi.gs apps-script/43_ScheduleHistory.gs apps-script/60_TimeReview.gs
          git rm -f .github/patches/2026-09-13-effective-schedule-history.py .github/patches/2026-09-13-effective-schedule-history.trigger .github/workflows/apply-effective-schedule-history-refactor.yml
          git commit -m 'feat: preserve attendance timing by effective schedule timestamp'
          git push
