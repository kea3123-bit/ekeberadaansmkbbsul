name: Materialize eKeberadaan source

on:
  push:
    paths:
      - '_sync/READY'
      - '.github/workflows/materialize-source.yml'

permissions:
  contents: write

jobs:
  materialize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Reconstruct source archive
        shell: bash
        run: |
          set -euo pipefail
          cat \
            _sync/source.part.000 \
            _sync/source.part.001 \
            _sync/source.part.002 \
            _sync/source.part.003 \
            _sync/rest.part.000 \
            _sync/rest.part.001 \
            _sync/rest.part.002 \
            _sync/rest.part.004 \
            _sync/rest004.0 \
            _sync/rest004.1 \
            _sync/rest.part.005 \
            _sync/rest.part.006 \
            > /tmp/source.tar.gz.b64

          base64 -d -i /tmp/source.tar.gz.b64 > /tmp/source.tar.gz
          tar -xzf /tmp/source.tar.gz

          test -s Code.gs
          test -s Index.html
          test -s Scripts.html
          test -s Styles.html
          echo 'Legacy Apps Script source reconstructed successfully.'

          rm -rf _sync

      - name: Commit full fixed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Code.gs Index.html Scripts.html Styles.html _sync
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'chore: materialize legacy Apps Script backend'
          git push
