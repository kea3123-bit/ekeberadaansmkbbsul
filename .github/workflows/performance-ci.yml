name: Performance refactor CI

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - 'Index.html'
      - 'Logo.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'package.json'
      - 'web/**'
      - 'scripts/build-pages.py'
      - 'apps-script/**'
      - '.github/workflows/performance-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build modular static site
        run: python3 scripts/build-pages.py

      - name: Validate frontend and backend syntax
        shell: bash
        run: |
          set -euo pipefail
          for f in _site/assets/*.js; do node --check "$f"; done
          node --check _site/vendor/bootstrap/bootstrap.bundle.min.js
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js

      - name: Verify absence categories and maternity duration
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const stored = [];
          const ctx = {
            Utilities: {getUuid: () => 'abcdefab-0000-0000-0000-000000000000'},
            requireSessionUser_: () => ({email:'test@example.edu.my', name:'Test', category:'PPP', jobTitle:'Guru'}),
            validateDateKey_: key => key,
            getSystemStartDate_: () => '2026-09-01',
            normalizeTime_: value => String(value || ''),
            timeToMinutes_: value => {const [hours,minutes]=value.split(':').map(Number);return hours*60+minutes},
            todayKey_: () => '2026-10-03',
            getSheetOrThrow_: () => ({getLastRow: () => 1, appendRow: row => stored.push(row)}),
            invalidateAbsenceRows_: () => {},
            audit_: () => {},
            notifyAbsenceSubmitted_: () => ({ok:false})
          };
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('apps-script/00_Core.gs','utf8'),ctx);
          vm.runInContext(fs.readFileSync('apps-script/61_Absence.gs','utf8'),ctx);
          vm.runInContext('readAbsenceRows_ = () => []',ctx);
          const settings = vm.runInContext('EK',ctx);
          const leaves = [
            'CUTI BERSALIN','CUTI BARAH','CUTI HAJI','CUTI MENJAGA ANAK',
            'CUTI TANPA GAJI','CUTI BELAJAR (BERGAJI PENUH)',
            'CUTI BELAJAR (SEPARUH GAJI)'
          ];
          leaves.forEach(type=>{
            assert(settings.ABSENCE_TYPES.includes(type),type+' missing from Tidak Hadir');
            assert(!settings.PRESENCE_TYPES.includes(type),type+' must not appear under Keberadaan');
          });
          ['AKTIVITI KOKURIKULUM','AKTIVITI SUKAN/PERMAINAN'].forEach(type=>{
            assert(settings.ABSENCE_TYPES.includes(type));
            assert(settings.PRESENCE_TYPES.includes(type));
          });
          assert(!settings.PRESENCE_TYPES.includes('MESYUARAT DALAM SEKOLAH'));
          assert.equal(settings.MATERNITY_LEAVE_MAX_DAYS,90);
          const request = (type,endDate,mode='TIDAK_HADIR') => ({
            type,mode,startDate:'2026-10-01',endDate,startTime:'08:30',endTime:'16:30'
          });
          assert.equal(ctx.submitAbsenceRequest('session',request('CUTI BERSALIN','2026-12-29')).ok,true);
          assert.throws(()=>ctx.submitAbsenceRequest('session',request('CUTI BERSALIN','2026-12-30')),/maksimum 90 hari/);
          assert.throws(()=>ctx.submitAbsenceRequest('session',request('CUTI REHAT','2026-12-29')),/maksimum 60 hari/);
          assert.equal(ctx.submitAbsenceRequest('session',request('AKTIVITI KOKURIKULUM','2026-10-01','KEBERADAAN')).ok,true);
          assert.throws(()=>ctx.submitAbsenceRequest('session',request('MESYUARAT DALAM SEKOLAH','2026-10-01','KEBERADAAN')),/tidak sah/);
          assert.equal(stored.length,2);
          console.log('ABSENCE_POLICY_OK: leave categories, activities, removed option, 90 vs 91 days');
          NODE

      - name: Verify system-admin-only absence review access
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const backend = fs.readFileSync('apps-script/61_Absence.gs','utf8');
          const frontend = fs.readFileSync('Scripts.html','utf8');
          const markup = fs.readFileSync('Index.html','utf8');
          const ctx = {
            requireSessionUser_: () => ({email:'initial@example.edu.my',category:'PPP',isAdmin:false})
          };
          vm.createContext(ctx);
          vm.runInContext(backend,ctx);
          for (const category of ['Pengurusan','Pentadbir','PPP','AKP']) {
            ctx.requireSessionUser_ = () => ({email:'ordinary@example.edu.my',category,isAdmin:false});
            assert.equal(ctx.isManagementUser_(ctx.requireSessionUser_('token')),false);
            assert.throws(() => ctx.getAbsenceManagementData('token'),/Akses Pentadbir Sistem/);
            assert.throws(() => ctx.reviewAbsenceRequest('token','TH-test','DILULUSKAN',''),/Akses Pentadbir Sistem/);
            assert.throws(() => ctx.generateAbsencePresencePdf('token',{}),/Akses Pentadbir Sistem/);
            assert.throws(() => ctx.checkUserAvailabilityForClass('token','test@example.edu.my','2026-10-04','08:30'),/Akses Pentadbir Sistem/);
          }
          ctx.requireSessionUser_ = () => ({email:'admin@example.edu.my',category:'PPP',isAdmin:true});
          assert.equal(ctx.isManagementUser_(ctx.requireSessionUser_('token')),true);
          assert.equal(ctx.requireManagementUser_('token').email,'admin@example.edu.my');
          assert.match(frontend,/absenceManageMenu'\)\?\.classList\.toggle\('hidden',!b\.user\.isAdmin\)/);
          assert.match(frontend,/name==='absencemanage'&&!state\.boot\?\.user\?\.isAdmin/);
          assert.match(frontend,/async function loadAbsenceManagement\(force=false\)\{\s*if\(!state\.boot\?\.user\?\.isAdmin\)return/);
          assert.match(markup,/Khas Pentadbir Sistem<\/div><h1>Semakan Tidak Hadir \/ Keberadaan/);
          assert.match(frontend,/if\(name==='absencepublic'\)loadAbsencePublic\(\)/);
          assert.match(frontend,/if\(name==='absence'\)loadAbsenceData\(\)/);
          console.log('ABSENCE_ADMIN_ONLY_OK: management users denied, marked admins authorized, public/own routes retained');
          NODE

      - name: Verify colour-only absence and presence report cells
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const assert = require('node:assert/strict');
          const fs = require('node:fs');
          const vm = require('node:vm');
          const ctx = {
            normalizeEmail_: value => String(value||'').toLowerCase(),
            getSettings_: () => ({SCHOOL_NAME:'Test School'}),
            SpreadsheetApp: {BorderStyle:{SOLID:'SOLID'}}
          };
          vm.createContext(ctx);
          vm.runInContext(fs.readFileSync('apps-script/30_Reporting.gs','utf8'),ctx);
          const palette = vm.runInContext('EK_REPORT_TEMPLATE_COLORS_',ctx);
          const user = {email:'test@example.edu.my',name:'Pegawai',jobTitle:'Guru',category:'PPP'};
          const dates = ['2026-10-07','2026-10-08','2026-10-09'];
          const data = {
            users:[user],dates,fromDate:dates[0],toDate:dates[2],summary:[],
            detailMap:{
              'test@example.edu.my|2026-10-07':{status:'TIDAK HADIR',source:'TIDAK_HADIR',reason:'CUTI REHAT - CATATAN PANJANG'},
              'test@example.edu.my|2026-10-08':{status:'BELUM HADIR',source:'KEBERADAAN',reason:'MESYUARAT LUAR - CATATAN PANJANG'},
              'test@example.edu.my|2026-10-09':{status:'HADIR',inTime:'07:30',outTime:'16:00'}
            },
            presenceDateMap:{'test@example.edu.my|2026-10-08':true},
            holidayByDate:{},workingByDate:{'2026-10-07':true,'2026-10-08':true,'2026-10-09':true}
          };
          function fakeSheet(){
            const ranges={};
            const sheet={
              ranges,getMaxRows:()=>1000,getMaxColumns:()=>26,
              getRange(...args){
                const key=args.join(':');
                const range={
                  setValues(value){ranges[key]={...(ranges[key]||{}),values:value};return range},
                  setBackgrounds(value){ranges[key]={...(ranges[key]||{}),colors:value};return range}
                };
                for(const method of ['setValue','merge','setBackground','setFontColor','setFontSize','setFontWeight','setHorizontalAlignment','setVerticalAlignment','setWrap','setBorder']){
                  range[method]=()=>range;
                }
                return range;
              }
            };
            for(const method of ['setColumnWidth','setColumnWidths','setFrozenRows','setRowHeights','setRowHeight','insertRowsAfter','insertColumnsAfter'])sheet[method]=()=>{};
            return sheet;
          }
          const punch=fakeSheet(),daily=fakeSheet(),pdf=fakeSheet();
          ctx.writeAttendancePunchTemplate_(punch,data,dates);
          ctx.writeAttendanceDailyTemplate_(daily,data,dates);
          ctx.writeAttendanceDailySinglePage_(pdf,data,dates,user,1);
          const punchRow=punch.ranges['5:1:1:3'];
          assert.deepEqual(Array.from(punchRow.values[0]),['','','07:30\n16:00']);
          assert.deepEqual(Array.from(punchRow.colors[0]),[palette.orange,palette.presence,palette.white]);
          for(const [sheet,key,start] of [[daily,'4:1:16:16',0],[pdf,'1:1:22:16',3]]){
            const block=sheet.ranges[key];
            for(let i=0;i<2;i++){
              assert(block.values[start+i][0],'date must remain visible');
              assert(block.values[start+i].slice(2,8).every(v=>v===''),'no absence/presence text or reason');
              assert(block.colors[start+i].slice(0,8).every(c=>c===([palette.orange,palette.presence][i])));
            }
            assert.equal(block.values[start+2][2],'07:30','actual punch times must be retained');
          }
          const pending=ctx.templateCellForDate_({
            detailMap:{'test@example.edu.my|2026-10-07':{status:'BELUM HADIR',source:'TIDAK_HADIR',reason:'CUTI'}},
            workingByDate:{'2026-10-07':true}
          },user,'2026-10-07');
          assert.equal(pending.text,'');
          assert.equal(ctx.templateCellBackground_(pending,palette),palette.orange);
          console.log('COLOUR_ONLY_REPORT_OK: Punch, Sheet Individu, PDF Individu and pending absence');
          NODE

      - name: Browser runtime smoke
        shell: bash
        run: |
          set -euo pipefail
          CHROME=$(command -v google-chrome || command -v chromium || command -v chromium-browser)
          "$CHROME" --version
          python3 -m http.server 4173 --directory _site >/tmp/eke-http.log 2>&1 &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT
          for n in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:4173/ >/dev/null && break
            sleep 1
          done
          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --virtual-time-budget=4000 --dump-dom \
            'http://127.0.0.1:4173/' > /tmp/runtime-dom.html
          grep -q 'data-ek-runtime="ready"' /tmp/runtime-dom.html
          grep -q 'data-ek-bootstrap="ready"' /tmp/runtime-dom.html
          grep -q 'id="loginPage"' /tmp/runtime-dom.html

          "$CHROME" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage \
            --window-size=390,844 --virtual-time-budget=4000 --dump-dom \
            'http://127.0.0.1:4173/' > /tmp/runtime-mobile-dom.html
          grep -q 'data-ek-runtime="ready"' /tmp/runtime-mobile-dom.html
          grep -q 'data-ek-bootstrap="ready"' /tmp/runtime-mobile-dom.html
          grep -q 'class="content container-fluid"' /tmp/runtime-mobile-dom.html
          echo "BROWSER_RUNTIME_OK DESKTOP_DOM=$(wc -c < /tmp/runtime-dom.html) MOBILE_DOM=$(wc -c < /tmp/runtime-mobile-dom.html)"

      - name: Verify full Bootstrap frontend contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"' _site/index.html
          grep -q 'vendor/bootstrap/bootstrap.min.css' _site/index.html
          grep -q 'vendor/bootstrap/bootstrap.bundle.min.js' _site/index.html
          test -s _site/vendor/bootstrap/bootstrap.min.css
          test -s _site/vendor/bootstrap/bootstrap.bundle.min.js
          ! grep -q 'cdn.jsdelivr.net' _site/index.html
          grep -q 'class="content container-fluid"' _site/index.html
          grep -q 'class="sidebar collapse"' _site/index.html
          grep -q 'nav nav-pills flex-column' _site/index.html
          grep -q 'modal-dialog modal-dialog-centered modal-dialog-scrollable modal-lg' _site/index.html
          grep -q 'data-bs-dismiss="toast"' _site/index.html
          grep -R -q 'spinner-border spinner-border-sm' _site/assets
          grep -R -q 'bootstrap.Collapse' _site/assets
          grep -R -q 'bootstrap.Modal' _site/assets
          grep -R -q 'bootstrap.Toast' _site/assets
          ls _site/assets/mobile.*.css >/dev/null
          grep -q '@media (max-width:767.98px)' web/mobile-bootstrap.css
          grep -q 'sidebar.collapse:not(.show)' web/mobile-bootstrap.css
          grep -q 'overflow-x:auto' web/mobile-bootstrap.css

      - name: Verify admin modal and async loading regression contracts
        shell: bash
        run: |
          set -euo pipefail
          grep -q '.modal #modalContent input:not' web/mobile-bootstrap.css
          grep -q '.modal #modalContent select' web/mobile-bootstrap.css
          grep -q '.modal #modalContent textarea' web/mobile-bootstrap.css
          grep -q '.modal #modalContent .check-line' web/mobile-bootstrap.css
          grep -q '.modal #modalContent .modal-grid' web/mobile-bootstrap.css
          grep -R -q 'function openUserModal' _site/assets
          grep -R -q 'jobTitle' _site/assets
          grep -R -q 'name=.*category' _site/assets
          grep -q 'function beginGlobalLoading' web/gas-shim.js
          grep -q 'function startRequestButton' web/gas-shim.js
          grep -q "ekGlobalLoading" web/gas-shim.js
          grep -q '#ekGlobalLoading' web/mobile-bootstrap.css
          grep -R -q 'Sedang memproses' _site/assets
          grep -q 'queryBackend,configuredBackend,storedBackend' web/gas-shim.js

      - name: Performance budget
        shell: bash
        run: |
          set -euo pipefail
          html=$(wc -c < _site/index.html)
          js=$(find _site -type f -name '*.js' -print0 | xargs -0 cat | wc -c)
          css=$(find _site -type f -name '*.css' -print0 | xargs -0 cat | wc -c)
          total=$(du -sb _site | awk '{print $1}')
          echo "HTML=$html bytes"
          echo "JS(all, including Bootstrap)=$js bytes"
          echo "CSS(all, including Bootstrap)=$css bytes"
          echo "TOTAL=$total bytes"
          test "$html" -lt 100000
          test "$js" -lt 350000
          test "$css" -lt 350000
          test "$total" -lt 900000

      - name: Verify canonical backend contract
        shell: bash
        run: |
          set -euo pipefail
          grep -R -q 'function doPost(e)' apps-script
          grep -R -q 'function checkDelimaAccount(' apps-script
          grep -R -q 'function loginWithPin(' apps-script
          grep -R -q 'function resumeSession(' apps-script
          grep -R -q 'function punch(' apps-script
          grep -q 'const slot = ensureAttendanceSlotForUser_' apps-script/20_UserApi.gs
          ! grep -q "acquireAttendanceKeyLock_('PUNCH'" apps-script/20_UserApi.gs
          grep -q 'function ensureAttendanceSlotForUser_' apps-script/41_AttendanceData.gs
          grep -q 'function registerAttendanceRowsBatch_' apps-script/41_AttendanceData.gs
          grep -q 'direct per-user row writes' apps-script/95_Diagnostics.gs
          grep -q 'WEB_APP_PARALLEL_DIRECT_ROW' apps-script/96_PerformanceBurstTest.gs
          grep -R -q 'function getAdminData(' apps-script
          grep -R -q 'function getAttendanceRowIndex_' apps-script
          grep -R -q 'function getSuccessfulLoginEmails_' apps-script
          grep -R -q 'EK_ATT_INDEX_CACHE_KEY_' apps-script/41_AttendanceData.gs
          grep -R -q 'EK_TRUSTED_TOUCH_MIN_INTERVAL_MS_' apps-script/11_Sessions.gs
          grep -R -q 'recent && sameFingerprint' apps-script/11_Sessions.gs
          grep -R -q 'invalidateTimeReviewRows_();' apps-script/60_TimeReview.gs
          grep -R -q 'function diagnosePerformanceBackend' apps-script/95_Diagnostics.gs
          grep -q "CATEGORIES: \['Pengurusan', 'AKP', 'PPP', 'Praktikum', 'MySTEP'\]" apps-script/00_Core.gs
          grep -q "Praktikum:'04 - Praktikum'" apps-script/70_Profile.gs
          grep -q "MySTEP:'05 - MySTEP'" apps-script/70_Profile.gs
          # Attendance admin-edit provenance must survive backend -> both punch cards.
          grep -q "'MedanDisuntingPentadbir'" apps-script/00_Core.gs
          grep -q "adminEditedFieldsForCard_" apps-script/20_UserApi.gs
          grep -q "changedFields" apps-script/21_AdminApi.gs
          grep -q "pc-time-admin-edit" Styles.html
          grep -q "pc-time-admin-edit" web/config.js
          # IP detection/policy is retired; device telemetry remains.
          ! grep -R -q "api\.ipify\.org" Scripts.html web apps-script
          ! grep -R -q "api64\.ipify\.org" Scripts.html web apps-script
          ! grep -R -q "IP_TRACKING_ENABLED" Scripts.html Index.html web apps-script
          ! grep -R -q "IP_PUNCH_POLICY" Scripts.html Index.html web apps-script
          ! grep -R -q "evaluatePunchIp_" Scripts.html web apps-script
          ! grep -R -q "registerPunchIpUse_" Scripts.html web apps-script
          ! grep -R -q "publicIpv4" Scripts.html web apps-script
          ! grep -R -q "publicIpv6" Scripts.html web apps-script
          grep -q "function inferClientDeviceType" Scripts.html
          grep -q "function syncClientTelemetry" Scripts.html
          # Public absence list defaults to newest submission and has sortable numbering.
          grep -q "default:'submitted_desc'" Scripts.html
          grep -q "sort-absencePublic-order" Index.html
          # Absence form quick dates and start->end synchronization.
          grep -q "setAbsenceQuickDate('today')" Index.html
          grep -q "setAbsenceQuickDate('tomorrow')" Index.html
          grep -q 'onchange="syncAbsenceDatesFromStart()"' Index.html
          grep -q "function setAbsenceQuickDate" Scripts.html
          grep -q "function syncAbsenceDatesFromStart" Scripts.html
          grep -q "end.value=start.value" Scripts.html
          grep -q "absenceTodayShortcutDate" Scripts.html
          grep -q "absenceTomorrowShortcutDate" Scripts.html
          # Admin attendance report pack follows the supplied Summary/Abnormal/Punch/Daily templates.
          grep -q "function writeAttendanceSummaryTemplate_" apps-script/30_Reporting.gs
          grep -q "function writeAttendanceAbnormalTemplate_" apps-script/30_Reporting.gs
          grep -q "function writeAttendancePunchTemplate_" apps-script/30_Reporting.gs
          grep -q "setValue('Laporan Perakam Waktu')" apps-script/30_Reporting.gs
          grep -q "reportTemplateChunk_(data.users||\[\],5)" apps-script/30_Reporting.gs
          grep -q "function writeAttendanceDailySinglePage_" apps-script/30_Reporting.gs
          grep -q "writeAttendanceDailySinglePage_" apps-script/30_Reporting.gs
          grep -q "PERAKAM WAKTU" apps-script/30_Reporting.gs
          grep -q "INDIVIDU" apps-script/30_Reporting.gs
          grep -q "function writeAttendanceDailyTemplate_" apps-script/30_Reporting.gs
          grep -q "function ensureAttendanceTemplateGrid_" apps-script/30_Reporting.gs
          grep -q "Jana PDF Template" Index.html
          grep -q "Jana Template ke Sheet" Index.html
          grep -q "submittedMs" apps-script/61_Absence.gs
          grep -q "\['Bil.','Nama','Jawatan','Kategori','Mod','Jenis','Tarikh / Tempoh','Masa','Status'\]" apps-script/61_Absence.gs
          grep -R -q 'EK_RUNTIME_ABSENCE_ROWS_' apps-script
          grep -R -q 'Asia/Kuala_Lumpur' apps-script/appsscript.json
          grep -R -q 'function isPagesWebOriginAllowed_' apps-script/Bridges.gs
          grep -R -q 'EK_PAGES_ORIGINS' apps-script/Bridges.gs
          # Enam jenis urusan rasmi bertanda mesti sah untuk kedua-dua
          # Tidak Hadir dan Keberadaan melalui kumpulan kongsi backend.
          grep -q 'const EK_EXTERNAL_OFFICIAL_TYPES' apps-script/00_Core.gs
          grep -q "BENGKEL/KURSUS/SEMINAR (PPD)" apps-script/00_Core.gs
          grep -q "BENGKEL/KURSUS/SEMINAR (JPN)" apps-script/00_Core.gs
          grep -q "BENGKEL/KURSUS/SEMINAR (KPM)" apps-script/00_Core.gs
          grep -q "MESYUARAT/TAKLIMAT (PPD)" apps-script/00_Core.gs
          grep -q "MESYUARAT/TAKLIMAT (JPN)" apps-script/00_Core.gs
          grep -q "MESYUARAT/TAKLIMAT (KPM)" apps-script/00_Core.gs
          test "$(grep -o '\.\.\.EK_EXTERNAL_OFFICIAL_TYPES' apps-script/00_Core.gs | wc -l)" -eq 2
          ! grep -R -q "createTemplateFromFile('Index')" apps-script/*.gs
          test ! -e Code.gs
          test ! -e .github/workflows/apps-script-deploy.yml
          test ! -e .github/workflows/mirror-repository.yml
          count=$(find apps-script -maxdepth 1 -name '*.gs' | wc -l)
          echo "Apps Script modules=$count"
          test "$count" -ge 16
