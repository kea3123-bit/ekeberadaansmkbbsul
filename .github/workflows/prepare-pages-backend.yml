name: Prepare Apps Script backend for GitHub Pages

on:
  push:
    branches:
      - migration/github-pages-appsscript
    paths:
      - 'scripts/prepare-pages-backend.py'
      - 'PagesBridge.gs'
      - 'Bridge.html'

permissions:
  contents: write

jobs:
  patch-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch doGet bridge route
        run: python3 scripts/prepare-pages-backend.py

      - name: Commit backend bridge patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- Code.gs; then
            echo 'Code.gs already prepared.'
            exit 0
          fi
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Code.gs
          git commit -m 'feat: route GitHub Pages through Apps Script bridge'
          git push
