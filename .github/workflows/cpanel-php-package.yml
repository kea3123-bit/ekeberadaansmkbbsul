name: Validate PHP report fix and package cPanel hotfix

on:
  push:
    branches:
      - refactor/performance-v2
    paths:
      - 'api.php'
      - '.htaccess'
      - 'php/**'
      - 'apps-script/10_Auth.gs'
      - 'apps-script/40_UsersData.gs'
      - 'apps-script/Bridges.gs'
      - 'apps-script/97_WorkspaceBridge.gs'
      - 'apps-script/tests/**'
      - '.github/workflows/cpanel-php-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-and-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check PHP and report regression
        run: |
          set -euo pipefail
          php -l api.php
          php -l php/api.php
          php -l php/_lib.php
          php -l php/workspace_bridge.php
          php -l php/workspace_services.php
          php php/tests/admin-report-settings-test.php
          php php/tests/public-users-bulk-test.php
          php php/tests/profile-photo-lookup-test.php
          php php/tests/email-outbox-test.php
          node --check < Scripts.html
          node --check < apps-script/Bridges.gs
          node --check < apps-script/97_WorkspaceBridge.gs
          node apps-script/tests/workspace-bridge-routing.test.js
          node apps-script/tests/pin-reset-fresh-read.test.js
          test ! -e php/config.local.php

      - name: Create one-file cPanel fix
        run: |
          set -euo pipefail
          mkdir -p /tmp/eke-fix/php /tmp/eke-backend/php
          cp php/api.php /tmp/eke-fix/php/api.php
          cp api.php .htaccess /tmp/eke-backend/
          cp php/api.php php/_lib.php php/workspace_bridge.php \
             php/workspace_services.php php/.htaccess /tmp/eke-backend/php/
          (cd /tmp/eke-fix && zip -qr "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-report-hotfix.zip" php)
          (cd /tmp/eke-backend && zip -qr "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-backend.zip" api.php .htaccess php)
          unzip -l ekeberadaansmkbbsul-report-hotfix.zip
          unzip -l ekeberadaansmkbbsul-backend.zip

      - name: Package 403 permission recovery with safe ZIP modes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/eke-403-recovery/php
          install -m 0644 .htaccess api.php /tmp/eke-403-recovery/
          install -m 0644 php/.htaccess php/api.php php/_lib.php /tmp/eke-403-recovery/php/
          chmod 0755 /tmp/eke-403-recovery/php
          (cd /tmp/eke-403-recovery && zip -qr "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-403-recovery.zip" .htaccess api.php php)
          python3 - <<'PY'
          import stat, zipfile
          with zipfile.ZipFile("ekeberadaansmkbbsul-403-recovery.zip") as z:
              expected={".htaccess","api.php","php/", "php/.htaccess","php/api.php","php/_lib.php"}
              assert set(z.namelist())==expected, z.namelist()
              for info in z.infolist():
                  mode=(info.external_attr >> 16) & 0o777
                  desired=0o755 if info.is_dir() else 0o644
                  assert mode==desired,(info.filename,oct(mode),oct(desired))
                  assert "config.local" not in info.filename
                  print(info.filename,oct(mode))
          print("CPANEL_ZIP_PERMISSIONS_SAFE")
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-403-recovery
          path: ekeberadaansmkbbsul-403-recovery.zip
          retention-days: 14

      - name: Package reviewed performance and security patch (no secrets)
        run: |
          set -euo pipefail
          mkdir -p /tmp/eke-perf-security/php
          cp .htaccess /tmp/eke-perf-security/.htaccess
          cp php/.htaccess php/api.php php/_lib.php /tmp/eke-perf-security/php/
          (cd /tmp/eke-perf-security && zip -qr "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-performance-security-hotfix.zip" .htaccess php)
          unzip -l ekeberadaansmkbbsul-performance-security-hotfix.zip
          ! unzip -Z1 ekeberadaansmkbbsul-performance-security-hotfix.zip | grep -E '(config\.local|error_log|\.sql)' 

      - uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-performance-security-hotfix
          path: ekeberadaansmkbbsul-performance-security-hotfix.zip
          retention-days: 14

      - name: Package profile photo backend fix (no secrets)
        run: |
          set -euo pipefail
          mkdir -p /tmp/eke-photo-hotfix/php
          cp php/_lib.php php/workspace_bridge.php php/workspace_services.php /tmp/eke-photo-hotfix/php/
          (cd /tmp/eke-photo-hotfix && zip -qr "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-profile-photo-hotfix.zip" php)
          unzip -l ekeberadaansmkbbsul-profile-photo-hotfix.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-profile-photo-hotfix
          path: ekeberadaansmkbbsul-profile-photo-hotfix.zip
          retention-days: 14

      - name: Package Apps Script bridge update (no secrets)
        run: |
          set -euo pipefail
          mkdir -p /tmp/eke-apps-script
          cp apps-script/Bridges.gs apps-script/97_WorkspaceBridge.gs /tmp/eke-apps-script/
          (cd /tmp/eke-apps-script && zip -qr "$GITHUB_WORKSPACE/ekeberadaansmkbbsul-apps-script-bridge.zip" Bridges.gs 97_WorkspaceBridge.gs)
          unzip -l ekeberadaansmkbbsul-apps-script-bridge.zip

      - uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-apps-script-bridge
          path: ekeberadaansmkbbsul-apps-script-bridge.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-report-hotfix
          path: ekeberadaansmkbbsul-report-hotfix.zip
          retention-days: 14

      - uses: actions/upload-artifact@v4
        with:
          name: ekeberadaansmkbbsul-backend
          path: ekeberadaansmkbbsul-backend.zip
          retention-days: 14
