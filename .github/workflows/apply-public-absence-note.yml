name: Apply public absence note

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-public-absence-note.yml'
      - '.github/scripts/add-public-absence-note.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply public absence note patch
        run: python3 .github/scripts/add-public-absence-note.py
      - name: Validate frontend and Apps Script contracts
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/frontend.js
          node --check /tmp/frontend.js
          cat apps-script/*.gs > /tmp/apps-script.js
          node --check /tmp/apps-script.js
          grep -Fq "note:String(r.note||'')" apps-script/61_Absence.gs
          grep -Fq 'r.type,r.note,r.startDate' apps-script/61_Absence.gs
          grep -Fq 'r.type,r.note,r.startDate' Scripts.html
          grep -Fq "String(r.note||'').trim()" Scripts.html
          ! grep -Fq 'catatan peribadi' Index.html
      - name: Commit app change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/add-public-absence-note.py .github/workflows/apply-public-absence-note.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: show catatan under type in public absence list'
          git push origin HEAD:refactor/performance-v2
