name: Cleanup obsolete branches

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/cleanup-obsolete-branches.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete obsolete branches
        shell: bash
        run: |
          set -euo pipefail
          for branch in \
            fix/requested-updates-v2 \
            migration/github-pages-appsscript \
            migration/nextjs-pwa
          do
            if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            else
              echo "Already absent: $branch"
            fi
          done
