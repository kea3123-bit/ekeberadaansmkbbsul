name: Progressive GPS radius 90 to 140 regression (safe staging)
on:
  push:
    branches: [fix/20261117-progressive-radius-v2]
  pull_request:
    branches: [refactor/performance-v2]
permissions:
  contents: read
jobs:
  radius-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP checks and raw distance boundaries
        run: |
          set -euo pipefail
          php -l php/api.php
          php php/tests/progressive-gps-radius-test.php
          php php/tests/thursday-wbf-home-test.php
          php php/tests/time-exception-reasons-test.php
      - name: Frontend map/label and existing punch behavior
        run: |
          set -euo pipefail
          node --check < mysql-ui/Scripts.html
          node mysql-ui/tests/progressive-gps-radius.test.js
          node mysql-ui/tests/thursday-wbf-home.test.js
          node mysql-ui/tests/mobile-reason-admin-notice.test.js
