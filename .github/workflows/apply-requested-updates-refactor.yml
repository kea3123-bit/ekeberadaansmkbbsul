name: Apply requested eKeberadaan updates on performance branch

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/scripts/patch-request-refactor.py'
      - '.github/workflows/apply-requested-updates-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply requested patches
        run: |
          python3 .github/scripts/patch-request-refactor.py
          curl -fsSL 'https://raw.githubusercontent.com/kea3123-bit/ekeberadaansmkbbsul/6182c980875ae1b8fb8fe5a03712d2eec45cac28/.github/scripts/patch-request-ui.py' -o /tmp/patch-request-ui.py
          python3 /tmp/patch-request-ui.py
      - name: Capture validation diagnostics
        shell: bash
        run: |
          set +e
          cat apps-script/*.gs > /tmp/apps-script.js
          node --check /tmp/apps-script.js >/tmp/backend.log 2>&1; backend=$?
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Scripts.html').read_text()
          a=s.find('<script>'); b=s.rfind('</script>')
          if a < 0 or b <= a: raise SystemExit('script wrapper not found')
          Path('/tmp/frontend.js').write_text(s[a+8:b])
          PY
          extract=$?
          node --check /tmp/frontend.js >/tmp/frontend.log 2>&1; frontend=$?
          grep -q 'AKTIVITI KOKURIKULUM' apps-script/00_Core.gs; g1=$?
          grep -q 'THURSDAY_WBF_ENABLED' apps-script/00_Core.gs; g2=$?
          grep -q 'allowOptionalSecondSession' apps-script/42_Settings.gs; g3=$?
          grep -q 'reviewerJobTitle' apps-script/60_TimeReview.gs; g4=$?
          grep -q 'reviewerJobTitle' apps-script/61_Absence.gs; g5=$?
          grep -q 'timeReviewSort' Index.html; g6=$?
          grep -q 'pc-time-alert' Styles.html; g7=$?
          {
            echo "backend=$backend"
            echo "extract=$extract"
            echo "frontend=$frontend"
            echo "grep_types=$g1 grep_wbf=$g2 grep_settings=$g3 grep_time=$g4 grep_absence=$g5 grep_sort=$g6 grep_style=$g7"
            echo "--- backend ---"
            cat /tmp/backend.log
            echo "--- frontend ---"
            cat /tmp/frontend.log
          } > VALIDATION_REQUESTED_UPDATES.txt
          exit 0
      - name: Commit diagnostic candidate branch
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-request-refactor.py .github/workflows/apply-requested-updates-refactor.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'test: candidate requested updates for performance branch'
          git push --force origin HEAD:fix/requested-updates-v2
