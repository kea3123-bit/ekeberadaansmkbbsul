name: Apply requested eKeberadaan updates on performance branch

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/scripts/patch-request-refactor.py'
      - '.github/workflows/apply-requested-updates-refactor.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Apply modular backend patch
        run: python3 .github/scripts/patch-request-refactor.py
      - name: Reuse validated frontend patch
        run: |
          curl -fsSL 'https://raw.githubusercontent.com/kea3123-bit/ekeberadaansmkbbsul/6182c980875ae1b8fb8fe5a03712d2eec45cac28/.github/scripts/patch-request-ui.py' -o /tmp/patch-request-ui.py
          python3 /tmp/patch-request-ui.py
      - name: Validate Apps Script and frontend syntax
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script.js
          node --check /tmp/apps-script.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('Scripts.html').read_text()
          a=s.find('<script>'); b=s.rfind('</script>')
          assert a>=0 and b>a
          Path('/tmp/frontend.js').write_text(s[a+8:b])
          PY
          node --check /tmp/frontend.js
          grep -q 'AKTIVITI KOKURIKULUM' apps-script/00_Core.gs
          grep -q 'THURSDAY_WBF_ENABLED' apps-script/00_Core.gs
          grep -q 'allowOptionalSecondSession' apps-script/42_Settings.gs
          grep -q 'reviewerJobTitle' apps-script/60_TimeReview.gs
          grep -q 'reviewerJobTitle' apps-script/61_Absence.gs
          grep -q 'timeReviewSort' Index.html
          grep -q 'pc-time-alert' Styles.html
      - name: Commit requested updates
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/patch-request-refactor.py .github/workflows/apply-requested-updates-refactor.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'feat: update reviews WBF punch sessions and sorting on performance branch'
          git push origin HEAD:refactor/performance-v2
