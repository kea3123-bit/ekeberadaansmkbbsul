name: Apply session break status fix

on:
  push:
    paths:
      - 'hotfixes/2026-09-11-session-break-status.trigger'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply patch
        run: python scripts/fix-session-break-status.py

      - name: Repair generated helper boundary
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('apps-script/40_UsersData.gs')
          src = path.read_text(encoding='utf-8')
          bad = "  if(type==='OUT')return getFinalOutReference_(schedule,user,settings,dateKey,values);\n  return '';\n}\n\n\n}\n"
          good = "  if(type==='OUT')return getFinalOutReference_(schedule,user,settings,dateKey,values);\n  return '';\n}\n"
          if src.count(bad) != 1:
              raise SystemExit(f'helper boundary: expected exactly 1 malformed boundary, got {src.count(bad)}')
          path.write_text(src.replace(bad, good, 1), encoding='utf-8')
          PY

      - name: Syntax check Apps Script files
        shell: bash
        run: |
          set -euo pipefail
          for f in apps-script/20_UserApi.gs apps-script/21_AdminApi.gs apps-script/30_Reporting.gs apps-script/40_UsersData.gs apps-script/41_AttendanceData.gs apps-script/60_TimeReview.gs; do
            cp "$f" /tmp/check.js
            node --check /tmp/check.js
          done

      - name: Commit fix and remove one-shot files
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git rm -f scripts/fix-session-break-status.py .github/workflows/apply-session-break-status.yml hotfixes/2026-09-11-session-break-status.trigger
          git add apps-script/20_UserApi.gs apps-script/21_AdminApi.gs apps-script/30_Reporting.gs apps-script/40_UsersData.gs apps-script/41_AttendanceData.gs apps-script/60_TimeReview.gs
          git commit -m 'fix: treat session 1 out as break before session 2'
          git push origin HEAD:refactor/performance-v2
