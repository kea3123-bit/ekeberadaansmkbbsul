name: Apply punch concurrency v4
# rerun after diagnostics marker update

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-punch-concurrency-v4.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-punch-concurrency-v4.py
      - name: Validate Apps Script syntax and v4 contract
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js
          grep -q "const slot = ensureAttendanceSlotForUser_" apps-script/20_UserApi.gs
          ! grep -q "acquireAttendanceKeyLock_('PUNCH'" apps-script/20_UserApi.gs
          grep -q "WEB_APP_PARALLEL_DIRECT_ROW" apps-script/96_PerformanceBurstTest.gs
          grep -q "direct per-user row writes" apps-script/95_Diagnostics.gs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "eKeberadaan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps-script/20_UserApi.gs apps-script/95_Diagnostics.gs apps-script/96_PerformanceBurstTest.gs
          if git diff --cached --quiet; then
            echo "No application changes needed"
            exit 0
          fi
          git commit -m "perf: use direct preallocated row writes for punch"
          git push origin HEAD:refactor/performance-v2
