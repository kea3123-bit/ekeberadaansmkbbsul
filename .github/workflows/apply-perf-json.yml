name: Apply perf JSON bridge patch

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-perf-json.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-perf-json.py
      - name: Validate Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js
          grep -q "function renderPagesBridgeTransport_" apps-script/Bridges.gs
          grep -q "direct.type === 'EK_BRIDGE_RESULT'" apps-script/96_PerformanceBurstTest.gs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps-script/Bridges.gs apps-script/96_PerformanceBurstTest.gs; then
            echo "No application changes needed"
            exit 0
          fi
          git config user.name "eKeberadaan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps-script/Bridges.gs apps-script/96_PerformanceBurstTest.gs
          git commit -m "fix: make burst-test responses machine-readable"
          git push origin HEAD:refactor/performance-v2
