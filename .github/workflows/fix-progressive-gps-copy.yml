name: Align progressive GPS status copy

'on':
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/fix-progressive-gps-copy.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - name: Update location preview status
        shell: bash
        run: |
          set -euo pipefail
          python3 -c "from pathlib import Path; p=Path('web/config.js'); s=p.read_text(); old='GPS sedang mencari titik terbaik untuk Punch Masuk.'; new='GPS bermula pada sasaran ±80m dan dilonggarkan bertahap hingga ±140m.'; assert old in s, 'preview status not found'; p.write_text(s.replace(old,new,1))"
      - name: Commit and clean workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/fix-progressive-gps-copy.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add web/config.js .github/workflows/fix-progressive-gps-copy.yml
          git commit -m "fix: align progressive GPS status copy"
          git push origin HEAD:refactor/performance-v2
