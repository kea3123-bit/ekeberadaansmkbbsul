name: Apply exam absence type update

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-exam-absence-type.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0

      - name: Apply dropdown option patch
        run: python3 .github/scripts/add-exam-absence-type.py

      - name: Validate frontend JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/eke-scripts.js
          node --check /tmp/eke-scripts.js
          grep -q "URUSAN PEPERIKSAAN" apps-script/00_Core.gs
          grep -q "URUSAN PEPERIKSAAN" Scripts.html

      - name: Commit source changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add apps-script/00_Core.gs Scripts.html
          if git diff --cached --quiet; then
            echo 'No source changes needed.'
            exit 0
          fi
          git commit -m 'feat: add Urusan Peperiksaan absence option'
          git push origin HEAD:refactor/performance-v2
