name: Apply GPS stability fix
on:
  push:
    branches: [refactor/performance-v2]
    paths: ['hotfixes/2026-09-13-gps-stability.trigger']
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/patches/2026-09-13-gps-stability.py
      - name: Validate source
        shell: bash
        run: |
          set -euo pipefail
          cp Scripts.html /tmp/ek-scripts.js
          node --check /tmp/ek-scripts.js
          cat apps-script/*.gs > /tmp/ek-backend.js
          node --check /tmp/ek-backend.js
          grep -q 'function bestPunchPosition' Scripts.html
          grep -q 'settingGpsAccuracy' Index.html
          grep -q 'accuracyM:loc.accuracyM' apps-script/20_UserApi.gs
          grep -q 'Bacaan GPS belum cukup stabil' apps-script/42_Settings.gs
      - name: Commit source fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add Scripts.html Index.html apps-script/20_UserApi.gs apps-script/42_Settings.gs
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'fix: stabilize GPS before enforcing punch radius'
          git push origin HEAD:refactor/performance-v2
