name: Apply punch card normal time weight

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-punchcard-time-weight.yml'
      - '.github/scripts/normalize-punchcard-time-weight.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Normalize normal punch-card time weight
        run: python3 .github/scripts/normalize-punchcard-time-weight.py
      - name: Validate CSS contract
        shell: bash
        run: |
          set -euo pipefail
          grep -q '.pc-row-hadir td:nth-child(2){font-weight:400}' Styles.html
          ! grep -q '.pc-row-hadir td:nth-child(2){font-weight:800}' Styles.html
          grep -q 'pc-time-exception' web/config.js
      - name: Commit app change and remove temporary patch files
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/scripts/normalize-punchcard-time-weight.py .github/workflows/apply-punchcard-time-weight.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add -A
          git commit -m 'fix: keep normal punch card times regular weight'
          git push origin HEAD:refactor/performance-v2
