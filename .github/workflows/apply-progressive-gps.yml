name: Apply progressive GPS acquisition

'on':
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-progressive-gps.yml'

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0

      - name: Patch progressive GPS flow
        shell: bash
        run: |
          set -euo pipefail
          echo '' | base64 -d > /tmp/apply_progressive_gps.py
          python3 /tmp/apply_progressive_gps.py

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/apply-progressive-gps.yml
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add Scripts.html web/config.js apps-script/00_Core.gs apps-script/42_Settings.gs .github/workflows/apply-progressive-gps.yml
          git commit -m "feat: use progressive 80-140m GPS acquisition"
          git push origin HEAD:refactor/performance-v2
