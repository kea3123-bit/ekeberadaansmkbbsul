name: Apply punch concurrency v3

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - '.github/workflows/apply-punch-concurrency-v3.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/performance-v2
          fetch-depth: 0
      - name: Apply patch
        run: python3 .github/scripts/patch-punch-concurrency-v3.py
      - name: Validate Apps Script syntax
        shell: bash
        run: |
          set -euo pipefail
          cat apps-script/*.gs > /tmp/apps-script-backend.js
          node --check /tmp/apps-script-backend.js
          grep -q "function ensureAttendanceSlotForUser_" apps-script/41_AttendanceData.gs
          grep -q "function acquireAttendanceKeyLock_" apps-script/41_AttendanceData.gs
          grep -q "WEB_APP_PARALLEL" apps-script/96_PerformanceBurstTest.gs
          grep -q "performance:{lockWaitMs,lockHeldMs,writeMs,slotWaitMs" apps-script/20_UserApi.gs
      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- apps-script/20_UserApi.gs apps-script/41_AttendanceData.gs apps-script/96_PerformanceBurstTest.gs; then
            echo "No application changes needed"
            exit 0
          fi
          git config user.name "eKeberadaan Bot"
          git config user.email "actions@users.noreply.github.com"
          git add apps-script/20_UserApi.gs apps-script/41_AttendanceData.gs apps-script/96_PerformanceBurstTest.gs
          git commit -m "perf: remove global punch write serialization"
          git push origin HEAD:refactor/performance-v2
