name: Publish optimized eKeberadaan web

on:
  push:
    branches: ["refactor/performance-v2"]
    paths:
      - 'Index.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'Logo.html'
      - 'package.json'
      - 'web/**'
      - 'scripts/build-pages.py'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install pinned frontend dependencies
        run: npm install --ignore-scripts --no-audit --no-fund

      - name: Build optimized static site
        run: python3 scripts/build-pages.py

      - name: Validate output
        shell: bash
        run: |
          set -euo pipefail
          test -f _site/index.html
          test -f _site/sw.js
          test -f _site/manifest.webmanifest
          test -f _site/vendor/bootstrap/bootstrap.min.css
          test -f _site/vendor/bootstrap/bootstrap.bundle.min.js
          ! grep -q 'data:image' _site/index.html
          ! grep -q 'cdn.jsdelivr.net' _site/index.html
          grep -q 'vendor/bootstrap/bootstrap.min.css' _site/index.html
          grep -q 'vendor/bootstrap/bootstrap.bundle.min.js' _site/index.html
          grep -R -q 'spinner-border spinner-border-sm' _site/assets
          html=$(wc -c < _site/index.html)
          total=$(du -sb _site | awk '{print $1}')
          echo "HTML=$html bytes TOTAL=$total bytes"
          test "$html" -lt 100000
          test "$total" -lt 900000

      - name: Capture expected live asset names
        id: expected
        shell: bash
        run: |
          set -euo pipefail
          mobile=$(grep -Eo 'assets/mobile\.[A-Za-z0-9]+\.css' _site/index.html | head -1)
          shim=$(grep -Eo 'assets/gas-shim\.[A-Za-z0-9]+\.js' _site/index.html | head -1)
          test -n "$mobile"
          test -n "$shim"
          echo "mobile=$mobile" >> "$GITHUB_OUTPUT"
          echo "shim=$shim" >> "$GITHUB_OUTPUT"
          echo "Expected mobile=$mobile shim=$shim"

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eke-gh-pages
          cp -a _site /tmp/eke-gh-pages
          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a /tmp/eke-gh-pages/. .
          git add -A
          git commit -m "deploy: optimized static web ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages

      - name: Verify exact build reached live GitHub Pages
        shell: bash
        env:
          EXPECTED_MOBILE: ${{ steps.expected.outputs.mobile }}
          EXPECTED_SHIM: ${{ steps.expected.outputs.shim }}
        run: |
          set -euo pipefail
          PAGE='https://kea3123-bit.github.io/ekeberadaansmkbbsul/'
          ok=0
          for n in $(seq 1 24); do
            code=$(curl -L --silent --show-error --max-time 20 \
              -H 'Cache-Control: no-cache' \
              -o /tmp/live.html -w '%{http_code}' "${PAGE}?deploy=${GITHUB_SHA}-${n}" || true)
            if [ "$code" = 200 ] \
              && grep -q "$EXPECTED_MOBILE" /tmp/live.html \
              && grep -q "$EXPECTED_SHIM" /tmp/live.html; then
              ok=1
              break
            fi
            echo "Waiting for Pages deployment (${n}/24)..."
            sleep 5
          done
          test "$ok" = 1
          curl -LfsS --max-time 20 -H 'Cache-Control: no-cache' "${PAGE}${EXPECTED_MOBILE}" -o /tmp/mobile.css
          curl -LfsS --max-time 20 -H 'Cache-Control: no-cache' "${PAGE}${EXPECTED_SHIM}" -o /tmp/gas-shim.js
          grep -q '.modal #modalContent input:not' /tmp/mobile.css
          grep -q '#ekGlobalLoading' /tmp/mobile.css
          grep -q 'function beginGlobalLoading' /tmp/gas-shim.js
          grep -q 'function startRequestButton' /tmp/gas-shim.js
          echo "LIVE_PAGES_EXACT_BUILD_OK mobile=${EXPECTED_MOBILE} shim=${EXPECTED_SHIM}"

# deployment source: refactor/performance-v2 · normal punch-card times regular weight 2026-09-11
