name: Publish eKeberadaan static web

on:
  push:
    branches:
      - migration/github-pages-appsscript
    paths:
      - 'Index.html'
      - 'Scripts.html'
      - 'Styles.html'
      - 'Logo.html'
      - 'web/**'
      - '.github/workflows/github-pages.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gh-pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build static site from Apps Script UI
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          index = Path('Index.html').read_text(encoding='utf-8')
          styles = Path('Styles.html').read_text(encoding='utf-8')
          logo = Path('Logo.html').read_text(encoding='utf-8')
          scripts = Path('Scripts.html').read_text(encoding='utf-8')

          required = ["<?!= include('Styles'); ?>", "<?!= include('Logo'); ?>", "<?!= include('Scripts'); ?>"]
          missing = [x for x in required if x not in index]
          if missing:
              raise SystemExit('Static build markers missing: ' + ', '.join(missing))

          index = index.replace("<?!= include('Styles'); ?>", styles)
          index = index.replace("<?!= include('Logo'); ?>", logo)
          index = index.replace("<?!= include('Scripts'); ?>", scripts)

          page_title = 'e-Keberadaan — Perakam Waktu Digital'
          if re.search(r'<title>.*?</title>', index, flags=re.I | re.S):
              index = re.sub(r'<title>.*?</title>', f'<title>{page_title}</title>', index, count=1, flags=re.I | re.S)
          else:
              index = index.replace('<base target="_top">', '<base target="_top">\n  <title>' + page_title + '</title>', 1)

          script_start = "  <script>\n  window.__EK_SCRIPTS_LOADED__ = false;"
          inject = "  <script src=\"./config.js\"></script>\n  <script src=\"./gas-shim.js\"></script>\n" + script_start
          if script_start not in index:
              raise SystemExit('Unable to locate main Scripts bootstrap block.')
          index = index.replace(script_start, inject, 1)

          bridge_css = '''\n<style>\n.ek-bridge-status{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:9999;background:#172033;color:#fff;padding:9px 14px;border-radius:999px;font:600 12px/1.3 Arial,sans-serif;box-shadow:0 8px 26px rgba(0,0,0,.22)}\n.ek-bridge-status.error{background:#b42318}.ek-bridge-status.ok{background:#067647}.ek-bridge-status.hidden{display:none}\n</style>\n'''
          index = index.replace('</head>', bridge_css + '</head>', 1)

          out = Path('_site')
          out.mkdir(exist_ok=True)
          (out / 'index.html').write_text(index, encoding='utf-8')
          (out / '.nojekyll').write_text('', encoding='utf-8')
          (out / 'config.js').write_text(Path('web/config.js').read_text(encoding='utf-8'), encoding='utf-8')
          (out / 'gas-shim.js').write_text(Path('web/gas-shim.js').read_text(encoding='utf-8'), encoding='utf-8')

          built = (out / 'index.html').read_text(encoding='utf-8')
          if '<?!=' in built or "google.script.run" not in scripts:
              raise SystemExit('Static site validation failed.')
          if '<title>' + page_title + '</title>' not in built:
              raise SystemExit('Page title validation failed.')
          print('Static site built successfully:', len(built), 'bytes')
          PY

      - name: Publish gh-pages branch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/eke-gh-pages
          cp -a _site /tmp/eke-gh-pages

          git config user.name 'eKeberadaan Bot'
          git config user.email 'actions@users.noreply.github.com'
          git checkout --orphan gh-pages
          git rm -rf .
          cp -a /tmp/eke-gh-pages/. .
          git add -A
          git commit -m "deploy: static web ${GITHUB_SHA}"
          git push --force origin HEAD:gh-pages
